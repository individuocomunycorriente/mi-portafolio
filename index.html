<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danko Leiva Contreras | Ingeniero de Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <link rel="icon" type="image/png" href="ed_icon.png">   
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <nav class="fixed top-0 left-0 w-full bg-slate-950/90 backdrop-blur-md border-b border-slate-800 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            
            <a href="#inicio" class="text-lg font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                
            </a>

            <div class="hidden md:flex space-x-6 text-sm font-medium items-center">
                <a href="#inicio" data-tab="inicio" class="nav-link py-2 px-1 transition-colors">Inicio</a>
                <a href="#educacion" data-tab="educacion" class="nav-link py-2 px-1 transition-colors">Educación</a>
                
                <div class="relative group py-2">
                    <button class="nav-link flex items-center gap-1 text-slate-400 group-hover:text-blue-400 transition-colors focus:outline-none">

                    </button>
                    <div class="absolute top-full left-0 mt-1 w-52 bg-slate-950 border border-slate-800 rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 p-1.5 space-y-1">
                        <a href="#experiencia-academica" data-tab="experiencia-academica" class="nav-link block px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-900 transition-colors text-xs">

                        <a href="#experiencia-laboral" data-tab="experiencia-laboral" class="nav-link block px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-900 transition-colors text-xs">

                        </a>
                    </div>
                </div>
                <a href="#proyectos" data-tab="proyectos" class="nav-link py-2 px-1 transition-colors">Portafolio</a>

                </a>

            <div class="flex items-center md:hidden">
                <button id="mobile-menu-button" class="text-slate-400 hover:text-white focus:outline-none text-xl p-2">
                    <i class="fa-solid fa-bars" id="menu-icon"></i>
                </button>
            </div>

        <div id="mobile-menu" class="hidden md:hidden bg-slate-950/95 border-b border-slate-800 px-4 pt-2 pb-4 space-y-3 font-medium text-sm">
            <a href="#inicio" data-tab="inicio" class="mobile-nav-link block py-2 text-slate-400 hover:text-white transition-colors">Inicio</a>
            <a href="#educacion" data-tab="educacion" class="mobile-nav-link block py-2 text-slate-400 hover:text-white transition-colors">Educación</a>
            
            <div class="border-t border-slate-800/50 pt-2 space-y-1">

            <a href="#contacto" data-tab="contacto" class="mobile-nav-link block text-center bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl transition-colors font-medium">
                Contactar
            </a>
        </div>

    <main id="content" class="flex-grow pt-20 md:pt-24 pb-12">
    </main>

    <footer class="py-6 bg-slate-950 border-t border-slate-800 text-center text-slate-600 text-xs">
        
    </footer>

    <script src="app.js"></script>

</html>
